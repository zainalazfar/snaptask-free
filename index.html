<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/snaptask/favicon.png" />
    <link rel="apple-touch-icon" href="/snaptask/pwa-icon-192.png" />
    <link rel="manifest" href="/snaptask/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapTask</title>
    <meta name="description" content="Ultra-fast meeting task management app with ChatGPT-style quick prompt input, instant image clipboard paste, interactive status tracking, and Excel export." />
    <!-- Google Fonts including Outfit (Google Sans match) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/snaptask/sw.js', { scope: '/snaptask/' }).then((reg) => {
            console.log('SnapTask PWA Service Worker registered:', reg.scope);
          }).catch((err) => {
            console.log('SnapTask PWA Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
